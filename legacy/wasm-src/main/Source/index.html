<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TactileBrowser</title>
  <style>
    body { margin: 0; background: #0D1117; color: #fff; font-family: sans-serif; }
    #canvas { display: block; margin: 10px auto; background: #1E1E1E; border: 1px solid #333; cursor: pointer; }
    #address-bar { width: 500px; font-size: 1.1em; padding: 4px; }
    #controls { margin: 10px auto; text-align: center; }
    #status { color: #FFD93D; margin-top: 8px; display: inline-block; margin-left: 10px; }
  </style>
</head>
<body>
  <div id="controls">
    <input type="text" id="address-bar" value="https://example.com">
    <button onclick="loadUrl()">Go</button>
    <span id="status">Loading...</span>
  </div>
  <canvas id="canvas" width="800" height="600"></canvas>

  <script src="glue.js"></script>
  <script type="module">
    import createModule from './TactileBrowserWasm.js';

    const canvas = document.getElementById('canvas');
    window.TactileBrowserCanvas = canvas;

    const modulePromise = createModule({
      locateFile: (path) => {
        if (path.endsWith('.wasm')) return './TactileBrowserWasm.wasm';
        return path;
      }
    });

    modulePromise.then((ModuleInstance) => {
      if (window.TactileBrowserWasm && typeof window.TactileBrowserWasm.init === 'function') {
        window.TactileBrowserWasm.init(ModuleInstance);
      } else {
        window.Module = ModuleInstance;
      }
    }).catch((err) => {
      const status = document.getElementById('status');
      status.textContent = 'WASM init error';
      status.style.color = '#FF6B6B';
      console.error('Failed to instantiate WASM module:', err);
    });

    // Mouse / Touch / Wheel event forwarding to WASM fdm core
    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      return {
        x: Math.floor(clientX - rect.left),
        y: Math.floor(clientY - rect.top)
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      const pos = getCanvasPos(e);
      if (window.Module && window.Module._wasm_pointer_event) {
        window.Module._wasm_pointer_event(pos.x, pos.y, 0); // FDM_POINTER_DOWN = 0
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const pos = getCanvasPos(e);
      if (window.Module && window.Module._wasm_pointer_event) {
        window.Module._wasm_pointer_event(pos.x, pos.y, 1); // FDM_POINTER_MOVE = 1
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      const pos = getCanvasPos(e);
      if (window.Module && window.Module._wasm_pointer_event) {
        window.Module._wasm_pointer_event(pos.x, pos.y, 2); // FDM_POINTER_UP = 2
      }
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 50);
      if (window.Module && window.Module._wasm_scroll_event) {
        window.Module._wasm_scroll_event(delta);
      }
    }, { passive: false });

    window.loadUrl = function() {
      const url = document.getElementById('address-bar').value;
      window.TactileBrowserWasm.loadUrl(url);
    };

    const addressBar = document.getElementById('address-bar');
    addressBar.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        window.loadUrl();
      }
    });
  </script>
</body>
</html>
