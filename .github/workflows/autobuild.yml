name: Build TactileBrowser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-build-universal:
    name: Build for MacOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build for MacOS (Universal)
        run: python3 scripts/build_macos.py --ci-env
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TactileBrowser_macOS
          path: dist/TactileBrowser.app
          retention-days: 30

  pocketmage-build:
    name: Build for PocketMage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build PocketMage app
        run: python3 scripts/build_pocketmage.py --ci-env
      - name: Upload PocketMage artifact
        uses: actions/upload-artifact@v4
        with:
          name: TactileBrowser_pocketmage
          path: pocketmage-src/browser.tar
          retention-days: 30

  tactility-build:
    name: Build for Tactility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup ESP-IDF environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev libsdl2-dev dfu-util libusb-1.0-0
      - name: Setup ESP-IDF
        run: python3 scripts/setup_esp_idf.py --ci-env
      - name: Build Tactility app
        run: python3 scripts/build_tactility.py --ci-env
      - name: Upload Tactility artifact
        uses: actions/upload-artifact@v4
        with:
          name: TactileBrowser_tactility
          path: tactility-src/build/TactileBrowser.app
          retention-days: 30
  
  wasm-build:
    name: Build for WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build WASM app
        run: python3 scripts/build_wasm.py --ci-env
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: TactileBrowser_wasm
          path: wasm-src/dist/
          retention-days: 30
